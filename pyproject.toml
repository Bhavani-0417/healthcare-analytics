[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "healthcare-los-analytics"
version = "0.2.0"
description = "Machine-learning experiments for patient length-of-stay classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["joblib>=1.3", "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "streamlit>=1.32"]
[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["jupyter>=1.0", "matplotlib>=3.8", "seaborn>=0.13", "xgboost>=2.0"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
